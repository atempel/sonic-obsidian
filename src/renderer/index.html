<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-eval': o Butterchurn compila as equações dos presets com new Function.
         img-src data:/blob:: alguns presets trazem texturas embutidas como imagens data:. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
    <title>Sonic Obsidian</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 8px; bottom: 8px; padding: 4px 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace; color: #cfd3dc;
        background: rgba(0, 0, 0, 0.55); border-radius: 4px; white-space: pre; pointer-events: none;
      }
      #drag { position: fixed; inset: 6px; -webkit-app-region: drag; }
      body.fullscreen #drag { display: none; }
      body.fullscreen.cursor-idle, body.fullscreen.cursor-idle * { cursor: none; }
      #toast {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        max-width: min(90vw, 900px); padding: 6px 12px; text-align: center;
        font: 14px/1.4 ui-sans-serif, 'Segoe UI', sans-serif; color: #eef0f5;
        background: rgba(0, 0, 0, 0.6); border-radius: 6px; overflow-wrap: anywhere;
        opacity: 0; transition: opacity 400ms ease; pointer-events: none;
      }
      #toast.visible { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="drag"></div>
    <div id="toast"></div>
    <div id="hud">Sonic Obsidian — iniciando…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
