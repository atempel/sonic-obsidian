<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-eval': o Butterchurn compila as equações dos presets com new Function.
         img-src data:/blob:: alguns presets trazem texturas embutidas como imagens data:. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
    <title>Sonic Obsidian</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 8px; bottom: 8px; padding: 4px 8px;
        font: 12px/1.4 'JetBrains Mono', ui-monospace, Consolas, monospace; z-index: 50; color: #cfd3dc;
        background: rgba(0, 0, 0, 0.55); border-radius: 4px; white-space: pre; pointer-events: none;
      }
      #drag { position: fixed; left: 6px; right: 166px; top: 6px; height: 40px; -webkit-app-region: drag; } /* termina antes do canto dos controles da janela (spec 014): o drag engole o mousemove */
      body.fullscreen #drag { display: none; }
      #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="dim"></div>
    <div id="drag"></div>
    <div id="ui"></div>
    <div id="hud" hidden>Sonic Obsidian — iniciando…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
