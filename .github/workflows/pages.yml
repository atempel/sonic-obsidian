name: pages

# Landing page (site/) no GitHub Pages — spec 017.
# PR que mexe em site/: só monta e sobe o site pronto como artifact para testar.
# Push em main: monta e publica em https://atempel.github.io/sonic-obsidian/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site-vendor.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/site-vendor.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run site:vendor
      - name: Nome do artifact
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Site pronto para testar
        uses: actions/upload-artifact@v4
        with:
          name: sonic-obsidian-site-${{ steps.meta.outputs.short }}
          path: site/
          retention-days: 14
      - name: Artifact do Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
