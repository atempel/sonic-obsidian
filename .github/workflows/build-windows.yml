name: build-windows

on:
  # Typecheck + testes headless em todo PR que mexe no app (barato, Ubuntu).
  # Build Windows só sob demanda (DECISIONS 2026-11-13): label `build-windows` no PR ou disparo manual.
  # O teste do usuário é por release, e o `release.yml` builda o Windows dela.
  # Sem `push` no main: o PR já foi checado antes do merge e a release checa de novo.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['site/**', 'docs/**', 'queue/**', '**/*.md']
  workflow_dispatch:

concurrency:
  # Pôr uma label não cancela o typecheck que está rodando para o mesmo commit.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Label nova não é código novo: não repete o typecheck.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Testes headless (spec 025). Sem devDependency por enquanto: Playwright entra só no CI, com --no-save.
      - run: npx -y playwright@1.63.0 install --with-deps chromium
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-windows:
    # Só com a label `build-windows` (ao pôr a label, ou em push num PR que já a tem) ou disparo manual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-windows') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'build-windows'))
    runs-on: windows-latest
    permissions:
      contents: read
      # Desempenho (spec 025): baixar o perf.json da execução anterior.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
      - name: Nome do artifact
        id: meta
        shell: bash
        run: echo "name=sonic-obsidian-win-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: release/win-unpacked/
          # Build de bloco de teste (disparo manual) fica 30 dias; o de PR, 7.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 7 }}
          if-no-files-found: error
      # Desempenho no app empacotado (spec 025, P1): abertura, ms por quadro e memória, ao lado da
      # execução anterior. Só falha se o script quebrar (o app não abre, um preset não desenha); número pior, não.
      - name: Desempenho (spec 025)
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          # A execução anterior com perf.json (artifact mais novo de outra execução), para o resumo lado a lado.
          read -r prev_run prev_name < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select((.name | startswith(\"perf-\")) and (.expired | not) and (.workflow_run.id != $GITHUB_RUN_ID))][0] | select(.) | \"\(.workflow_run.id) \(.name)\"") || true
          if [ -n "${prev_run:-}" ] && gh run download "$prev_run" -R "$GITHUB_REPOSITORY" -n "$prev_name" -D perf-prev; then
            export PERF_PREV=perf-prev/perf.json
          else
            echo "Sem execução anterior com perf.json."
          fi
          npm run perf:win
      - name: Nome do artifact de desempenho
        if: always()
        id: perfmeta
        shell: bash
        run: echo "name=perf-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.perfmeta.outputs.name }}
          path: perf.json
          retention-days: 90
          if-no-files-found: ignore
