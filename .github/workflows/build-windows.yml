name: build-windows

on:
  # Branches de trabalho buildam pelo PR (pull_request); push só no main.
  # Antes, feat/** e fix/** rodavam duas vezes com PR aberto (push + pull_request).
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**']
  pull_request:
    paths-ignore: ['site/**', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Testes headless (spec 025). Sem devDependency por enquanto: Playwright entra só no CI, com --no-save.
      - run: npx -y playwright@1.63.0 install --with-deps chromium
      - run: npm install --no-save --no-audit --no-fund playwright@1.63.0
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-windows:
    needs: typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:win
      - name: Nome do artifact
        id: meta
        shell: bash
        run: echo "name=sonic-obsidian-win-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: release/win-unpacked/
          retention-days: 7
          if-no-files-found: error
