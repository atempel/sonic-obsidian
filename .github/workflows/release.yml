name: release

# Spec 016: uma tag vX.Y.Z gera instalador, zip e checksums e cria a release como RASCUNHO.
# O usuário testa e publica à mão (Publish) no GitHub.
# Disparo manual com `version` (ex.: 0.5.0) faz o mesmo sem push de tag: o rascunho aponta para o
# commit disparado e o GitHub cria a tag vX.Y.Z quando o usuário publica.
# Junto vão o latest.yml e o .blockmap do atualizador (spec 029).
# Em PR que mexe no empacotamento, ou disparo sem `version`, só builda e sobe os arquivos como artifact (ensaio).
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['electron-builder.yml', '.github/workflows/release.yml', '.github/release-notes.md', 'package.json']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release, sem o v (ex.: 0.5.0). Vazio = só ensaio.'
        required: false
        default: ''
      publicar:
        description: 'Publicar direto (sem rascunho). Só com o ok do usuário no bloco de teste (skill rodada).'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      # Disparar o store.yml quando a release sai publicada (spec 044, etapa 2).
      actions: write
    env:
      # Tag da release: a tag enviada, ou v<version> no disparo manual; vazio = ensaio.
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag igual à versão do package.json
        if: env.TAG != ''
        shell: bash
        run: |
          tag="${TAG#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::A tag v$tag não bate com a versão do package.json ($version). Ajuste o package.json ou a tag."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run dist:release
      # Atualização automática (spec 029): o app instalado lê o latest.yml da release publicada.
      - name: latest.yml do atualizador
        shell: bash
        working-directory: release
        run: |
          test -f latest.yml || { echo "::error::latest.yml não foi gerado (falta o bloco publish no electron-builder.yml?)"; exit 1; }
          test -f SonicObsidian-Setup.exe.blockmap || { echo "::error::SonicObsidian-Setup.exe.blockmap não foi gerado"; exit 1; }
          cat latest.yml
          yml="$(sed -n 's/^version: *//p' latest.yml | tr -d "'\" ")"
          version="$(node -p "require('../package.json').version")"
          if [ "$yml" != "$version" ]; then
            echo "::error::latest.yml diz $yml, mas o package.json diz $version."
            exit 1
          fi
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$yml" ]; then
            echo "::error::latest.yml diz $yml, mas a tag é $TAG."
            exit 1
          fi
          grep -q 'SonicObsidian-Setup.exe' latest.yml || { echo "::error::latest.yml não aponta para SonicObsidian-Setup.exe"; exit 1; }
      - name: Checksums
        shell: bash
        working-directory: release
        run: |
          ls -la
          sha256sum SonicObsidian-Setup.exe SonicObsidian-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release (rascunho, ou publicada com publicar=true)
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          draft="--draft"
          [ "${{ inputs.publicar }}" = "true" ] && draft=""
          gh release create "$TAG" $draft $pre --target "$GITHUB_SHA" \
            --title "Sonic Obsidian $TAG" \
            --notes-file .github/release-notes.md \
            release/SonicObsidian-Setup.exe release/SonicObsidian-win-x64.zip release/SHA256SUMS.txt \
            release/latest.yml release/SonicObsidian-Setup.exe.blockmap
      # Microsoft Store (spec 044, etapa 2): release publicada direto (publicar=true) dispara o store.yml,
      # porque release criada com o GITHUB_TOKEN não gera o evento `release`. Rascunho publicado à mão
      # dispara o store.yml pelo próprio evento. O store.yml só roda com MSSTORE_ENABLED=true.
      - name: Microsoft Store
        if: env.TAG != '' && inputs.publicar && vars.MSSTORE_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run store.yml --ref main -f tag="$TAG"
      - name: Artifact do ensaio
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: sonic-obsidian-release-${{ github.sha }}
          path: |
            release/SonicObsidian-Setup.exe
            release/SonicObsidian-win-x64.zip
            release/SHA256SUMS.txt
            release/latest.yml
            release/SonicObsidian-Setup.exe.blockmap
          retention-days: 7
          if-no-files-found: error
