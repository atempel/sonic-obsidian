name: Feature idea
description: An idea already talked through in Discussions. New ideas start in Discussions › Ideas.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: New ideas start as a conversation in [Discussions › Ideas](https://github.com/atempel/sonic-obsidian/discussions/new?category=ideas); use this form for an idea that has already been discussed. Check the [roadmap](https://github.com/atempel/sonic-obsidian/blob/main/docs/PRD.md) first; some things are out of scope on purpose (recording, DRM content, embedded AI).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Sketches and references welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
