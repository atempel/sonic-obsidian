name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A clear report makes the fix much faster.
        In the app, **Report a problem** (Quick settings › speech bubble, or Settings › About › Feedback) fills in version, system, audio output and preset for you.
        Answers in Portuguese are welcome. Respostas em português são bem-vindas.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Play music in …
        3. Press …
  - type: input
    id: version
    attributes:
      label: App version or build
      placeholder: v0.1.0 or sonic-obsidian-win-<sha>
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and GPU
      placeholder: Windows 11 (build 22631), NVIDIA GeForce RTX 3070
  - type: input
    id: audio
    attributes:
      label: Audio output
      description: The Windows default output while it happened.
      placeholder: Speakers (Realtek), USB headphones…
  - type: input
    id: preset
    attributes:
      label: Preset on screen (if it matters)
      description: The full name shown in the control strip.
  - type: textarea
    id: log
    attributes:
      label: Diagnostics
      description: In the app, use **Copy diagnostics** (last 200 lines of the log) and paste here. If the app won't open, press Ctrl+Shift+L or open `logs/sonic-obsidian.log` in the app data folder and paste the last lines.
      render: text
