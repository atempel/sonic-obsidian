appId: dev.atempel.sonic-obsidian
productName: Sonic Obsidian
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon.ico
  - '!**/*.map'
extraFiles:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Atualização automática (spec 029): gera o app-update.yml (dentro do app) e o latest.yml + .blockmap
# (em release/). Quem cria a release continua sendo o workflow (`--publish never` + `gh`).
publish:
  provider: github
  owner: atempel
  repo: sonic-obsidian
  releaseType: release
win:
  # Release (spec 016): instalador + zip, x64. O CI de teste usa `--dir` (dist:win), que ignora esta lista.
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # Nomes sem versão, para o link fixo releases/latest/download/<arquivo> (a versão fica no título da release).
  artifactName: SonicObsidian-win-${arch}.${ext}
  icon: resources/icon.ico
  # Edita o .exe (rcedit) para pôr o ícone e os metadados; sem certificado, não assina.
  signAndEditExecutable: true
nsis:
  # Instalador por usuário, sem pedir admin; atalho no menu Iniciar.
  oneClick: true
  perMachine: false
  allowElevation: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Sonic Obsidian
  # Desinstalar mantém settings.json, library.json e o log no userData.
  deleteAppDataOnUninstall: false
  artifactName: SonicObsidian-Setup.${ext}
  # Idiomas do instalador (spec 030, P1): segue o idioma do Windows (pt-* → pt_BR, o resto → en_US),
  # sem seletor. Só os dois idiomas do app (o padrão do electron-builder embutia todos).
  installerLanguages: [en_US, pt_BR]
  displayLanguageSelector: false
# Microsoft Store (spec 044): pacote MSIX pelo alvo `appx` do electron-builder (`npm run dist:msix`,
# só no Windows: precisa do makeappx do Windows SDK). Sem certificado (CSC_LINK vazio), o pacote sai
# sem assinatura, que é o que a Store pede: ela assina depois da certificação. Identidade igual à do
# Partner Center (a Store recusa o pacote se um valor for diferente). `runFullTrust` entra sempre.
# Imagens do pacote em build/appx/, feitas do ícone do app (docs/brand/app-icon.svg), com as escalas e os
# tamanhos (targetsize, inclusive altform-unplated, que o Windows 11 usa no Iniciar e na barra de tarefas);
# com elas o electron-builder gera o resources.pri (makepri).
appx:
  identityName: AlexandreTempel.SonicObsidian
  publisher: CN=FB52A5F4-E46E-48B7-90A9-D2F6FC05DB7B
  publisherDisplayName: Alexandre Tempel
  applicationId: SonicObsidian
  displayName: Sonic Obsidian
  backgroundColor: '#0B0B0F'
  languages: [en-US, pt-BR]
  # Windows 10 1809 é o mínimo para um pacote .msix (e o Electron atual já pede Windows 10).
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: SonicObsidian-Store-${arch}.msix
