appId: dev.atempel.sonic-obsidian
productName: Sonic Obsidian
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon.ico
  - '!**/*.map'
extraFiles:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
win:
  target: dir
  icon: resources/icon.ico
  signAndEditExecutable: false
