<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Obsidian — V2.4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-00: #080809;
    --bg-01: #0F0F14;
    --bg-02: #16161E;
    --bg-03: #1D1D28;
    --border-subtle:  #1E1E2A;
    --border-medium:  #2A2A3A;
    --border-strong:  #3A3A50;
    --accent-violet:  #C244FF;
    --accent-cyan:    #00E5FF;
    --accent-beat:    #FF2D6B;
    --text-primary:   #EEEEF5;
    --text-secondary: #8080A0;
    --text-ghost:     #3A3A55;
    --text-mono:      #00E5FF;
    --font-ui:        'Space Grotesk', sans-serif;
    --font-mono:      'JetBrains Mono', monospace;
  }

  html, body, #root {
    width: 100%; height: 100%;
    background: #080809;
    overflow: hidden;
  }

  /* Range input global style */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 3px;
    background: var(--border-medium);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--accent-violet);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(194,68,255,0.5);
  }
  input[type=range]::-webkit-slider-runnable-track {
    background: linear-gradient(90deg, rgba(0,229,255,0.3), rgba(194,68,255,0.5));
    height: 3px; border-radius: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-00); }
  ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

  button { font-family: var(--font-ui); }

  /* Hover states for cards */
  [data-hover]:hover { border-color: var(--border-medium) !important; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="so-visualizer.jsx"></script>
<script type="text/babel" src="so-screens.jsx"></script>
<script type="text/babel" src="so-window.jsx"></script>

</body>
</html>
