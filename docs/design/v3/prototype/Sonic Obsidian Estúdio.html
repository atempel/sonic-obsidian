<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Obsidian — Estúdio (P0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="so-v3-base.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="so-v3-data.js"></script>
<script src="so-v3-viz.js"></script>
<style>
  html, body { overflow: hidden; }
  :root { --overlay: var(--bg-01); --warn-soft: rgba(255,181,71,0.12); --warn-line: rgba(255,181,71,0.4); }
  [hidden] { display: none !important; }
  .proto { left: 12px; top: auto; bottom: 12px; }

  .app { position: fixed; inset: 0; }
  #viz { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Coluna da esquerda: transparente, emoldura o visual */
  .left { position: absolute; left: 0; top: 0; bottom: 0; right: 460px; padding: 16px 16px 60px; transition: opacity var(--t-med) var(--ease-out); }
  .frame { position: relative; width: 100%; height: 100%; border: 1px solid var(--line-2); border-radius: var(--r-3); overflow: hidden; }
  .tag { position: absolute; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-01); border: 1px solid var(--line-2); font-size: 13px; color: var(--text-1); }
  .tag.tl { top: 0; left: 0; border-width: 0 1px 1px 0; border-radius: 0 0 var(--r-3) 0; font-weight: 500; }
  .tag.bl { bottom: 0; left: 0; right: 0; border-width: 1px 0 0 0; color: var(--text-2); font-size: 12px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .tag.bl b { font-weight: 500; color: var(--text-1); }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .tag.dirty .dot { background: var(--violet); }
  .applying { position: absolute; left: 0; bottom: 31px; height: 2px; width: 0; background: var(--violet); }
  .applying.run { animation: sweep 600ms var(--ease-out) forwards; }
  @keyframes sweep { from { width: 0; opacity: 1; } to { width: 100%; opacity: 0; } }

  /* Editor */
  .editor { position: absolute; right: 0; top: 0; bottom: 0; width: 460px; max-width: 100vw; display: flex; flex-direction: column; background: var(--overlay); border-left: 1px solid var(--line-2); box-shadow: var(--shadow-pop); transition: transform var(--t-med) var(--ease-out), visibility 0s; }
  .closed .editor { transform: translateX(100%); visibility: hidden; transition: transform var(--t-med) var(--ease-out), visibility 0s var(--t-med); }
  .closed .left { opacity: 0; pointer-events: none; }
  .reopen { position: absolute; right: 16px; top: 16px; display: none; }
  .closed .reopen { display: inline-flex; }

  .ed-head { position: relative; flex: none; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; }
  .ed-row { display: flex; align-items: center; gap: 6px; }
  .ed-row h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  .name-in { width: 100%; height: 34px; padding: 0 10px; background: var(--bg-00); border: 1px solid var(--line-2); border-radius: var(--r-2); font-weight: 600; font-size: 15px; color: var(--text-1); }
  .name-in:hover { border-color: var(--line-3); }
  .name-in:focus { border-color: var(--violet-line); }

  .confirm { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px; background: var(--bg-03); border-bottom: 1px solid var(--line-3); }
  .confirm span { flex: 1; font-weight: 500; }
  .confirm .btn { height: 30px; font-size: 13px; padding: 0 10px; }

  .balloon { position: absolute; z-index: 5; right: 52px; top: 52px; width: 300px; padding: 14px; background: var(--bg-02); border: 1px solid var(--line-3); border-radius: var(--r-3); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; gap: 8px; }
  .balloon::before { content: ""; position: absolute; top: -6px; right: 42px; width: 10px; height: 10px; background: var(--bg-02); border-top: 1px solid var(--line-3); border-left: 1px solid var(--line-3); transform: rotate(45deg); }
  .balloon h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .balloon .note { margin: 0; font-size: 12px; color: var(--text-3); }
  .balloon .row { display: flex; gap: 8px; }
  .balloon input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; background: var(--bg-00); border: 1px solid var(--line-3); border-radius: var(--r-2); }
  .balloon input:focus { border-color: var(--violet-line); }

  .ed-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .sec h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .sec-h h2 { margin: 0; }
  .sec-h .num { font-size: 12px; color: var(--text-3); }

  .live { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: var(--r-3); background: var(--bg-02); }
  .live h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .lrow { display: grid; grid-template-columns: 40px 1fr 44px; align-items: center; gap: 12px; }
  .lrow .nm { font-size: 13px; color: var(--text-1); }
  .lbar { height: 4px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
  .lbar i { display: block; height: 100%; width: 0; background: var(--cyan); border-radius: 4px; }
  .lrow .vv { text-align: right; font-size: 13px; color: var(--cyan); }

  .ed { display: flex; background: var(--bg-00); border: 1px solid var(--line-2); border-radius: var(--r-3); overflow: hidden; }
  .ed:focus-within { border-color: var(--violet-line); }
  .ed.bad { border-color: var(--warn-line); }
  .gut { width: 40px; flex: none; overflow: hidden; background: var(--bg-01); border-right: 1px solid var(--line-1); padding: 10px 0; user-select: none; }
  .gut div { height: 20px; text-align: right; padding-right: 10px; font: 12px/20px var(--font-num); color: var(--text-3); }
  .gut div.err { color: var(--warn); background: var(--warn-soft); }
  .ta { flex: 1; min-width: 0; margin: 0; padding: 10px 12px; border: 0; resize: none; background: transparent; color: var(--text-1); font: 13px/20px var(--font-num); white-space: pre; overflow: auto hidden; tab-size: 2; }
  .ta:focus { outline: none; }
  .ta:disabled { color: var(--text-2); cursor: default; }
  .err-msg { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0 0; font-size: 13px; color: var(--text-1); }
  .err-msg .ico { color: var(--warn); margin-top: 1px; width: 16px; height: 16px; }
  .err-msg .num { font-size: 12px; }

  .fold-t { width: 100%; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; background: var(--bg-02); border: 1px solid var(--line-2); border-radius: var(--r-3); color: var(--text-1); font-weight: 500; cursor: pointer; text-align: left; }
  .fold-t:hover { background: var(--bg-03); }
  .fold-t .ico { color: var(--text-2); transition: transform var(--t-med) var(--ease-out); }
  .fold-t[aria-expanded="true"] .ico { transform: rotate(90deg); }
  .fold-b { padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .note { margin: 0; font-size: 12px; color: var(--text-3); }

  .toast { position: fixed; z-index: 90; left: calc((100vw - 460px) / 2); bottom: 76px; transform: translate(-50%, 12px); background: var(--bg-03); border: 1px solid var(--line-3); border-radius: var(--r-3); padding: 9px 14px; box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: opacity var(--t-med) var(--ease-out), transform var(--t-med) var(--ease-out); max-width: calc(100vw - 500px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="viz" aria-hidden="true"></canvas>

  <div class="left">
    <div class="frame">
      <span class="tag tl" id="tag"><span class="dot"></span>Seu remix</span>
      <div class="applying" id="applying"></div>
      <div class="tag bl" id="from"></div>
    </div>
  </div>

  <button class="btn reopen" id="reopen"><i data-lucide="sliders-horizontal" class="ico ico-sm"></i>Abrir o Estúdio</button>

  <aside class="editor" id="editor" aria-label="Estúdio de presets">
    <header class="ed-head">
      <div class="ed-row">
        <h1>Estúdio</h1>
        <button class="btn btn-ghost" id="discard">Descartar</button>
        <button class="btn btn-primary" id="save">Salvar na biblioteca</button>
        <button class="ibtn" id="close" aria-label="Fechar o Estúdio" title="Fechar (Esc)"><i data-lucide="x" class="ico"></i></button>
      </div>
      <label class="sr-only" for="pname" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Nome do preset</label>
      <input class="name-in" id="pname" value="Meu preset" maxlength="60" spellcheck="false">
      <form class="balloon" id="balloon" hidden role="dialog" aria-labelledby="bt">
        <h2 id="bt">Seu nome nos presets</h2>
        <div class="row">
          <input id="author" placeholder="Como o crédito deve sair" aria-label="Seu nome nos presets" maxlength="40" autocomplete="off">
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
        <p class="note">Muda depois em Configurações › Geral.</p>
      </form>
    </header>

    <div class="confirm" id="confirm" role="alertdialog" aria-label="Descartar as mudanças?" hidden>
      <span>Descartar as mudanças?</span>
      <button class="btn" id="c-discard">Descartar</button>
      <button class="btn btn-ghost" id="c-keep">Continuar editando</button>
    </div>

    <div class="ed-body" id="body">
      <section class="live" aria-label="Áudio agora">
        <h2>Áudio agora</h2>
        <div class="lrow"><span class="nm">bass</span><div class="lbar"><i id="lb0"></i></div><span class="vv num" id="lv0">0,00</span></div>
        <div class="lrow"><span class="nm">mid</span><div class="lbar"><i id="lb1"></i></div><span class="vv num" id="lv1">0,00</span></div>
        <div class="lrow"><span class="nm">treb</span><div class="lbar"><i id="lb2"></i></div><span class="vv num" id="lv2">0,00</span></div>
      </section>

      <div id="blocks"></div>

      <section class="sec">
        <button class="fold-t" id="sh-t" aria-expanded="false" aria-controls="sh-b"><i data-lucide="chevron-right" class="ico ico-sm"></i>Shaders (só leitura)</button>
        <div class="fold-b" id="sh-b" hidden>
          <div class="ed"><div class="gut" id="sh-g"></div><textarea class="ta" id="sh-ta" rows="7" disabled aria-label="Shader de aquarela, só leitura"></textarea></div>
          <p class="note">Edição de shaders na próxima versão.</p>
        </div>
      </section>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var P = SO_DATA.presets[4];
  var viz = SOViz.create($('#viz'));
  viz.setPreset(P, 0);

  var BLOCKS = [
    { id: 'frame', title: 'Por quadro', hint: 'per_frame', rows: 5, text:
      'zoom = 1.02 + 0.04*bass;\nrot = rot + 0.012*sin(time*0.7)*mid;\nwarp = 0.8 + 1.4*treb;\ndecay = 0.96;\nq1 = bass_att*0.5;' },
    { id: 'vertex', title: 'Por vértice', hint: 'per_pixel', rows: 4, text:
      'zoom = zoom + 0.03*rad*bass;\nrot = rot + 0.02*(1 - rad)*sin(ang*3 + time);\ndx = 0.004*sin(y*12 + time)*treb;\ndy = dx*0.5 + q1*0.002;' },
    { id: 'init', title: 'Inicialização', hint: 'init', rows: 3, text:
      'q1 = 0.5;\nq2 = 1.5;\nob_size = 0.02;' }
  ];
  var SHADER = 'shader_body {\n  vec2 uv_w = uv * 1.0 + 0.01 * sin(time + uv.yx * 8.0);\n  vec3 ret = tex2D(sampler_main, uv_w).xyz;\n  ret *= 0.97 + 0.03 * bass;\n  ret = lerp(ret, ret.zxy, 0.08 * treb);\n  ret -= 0.015;\n}';

  // ---- validação simples ----
  var KNOWN = ('zoom rot warp decay cx cy dx dy sx sy zoomexp wave_r wave_g wave_b wave_a wave_x wave_y ob_size ob_r ob_g ob_b ob_a ib_size ib_r ib_g ib_b ib_a mv_x mv_y mv_a echo_zoom echo_alpha gamma' +
    ' bass mid treb bass_att mid_att treb_att time frame fps progress x y rad ang aspectx aspecty pixelsx pixelsy' +
    ' sin cos tan asin acos atan atan2 sqr sqrt abs min max pow exp log log10 int sign sigmoid rand above below equal if band bor bnot floor ceil').split(' ');
  var KNOWNSET = {}; KNOWN.forEach(function (k) { KNOWNSET[k] = 1; });
  function isKnown(n) { return KNOWNSET[n] || /^q([1-9]|[12]\d|3[0-2])$/.test(n) || /^monitor$/.test(n); }

  function validate(text) {
    var lines = text.split('\n'), depth = 0, assigned = {}, i, m;
    for (i = 0; i < lines.length; i++) { // variáveis atribuídas no bloco são válidas
      var c0 = lines[i].replace(/\/\/.*$/, '');
      if ((m = c0.match(/^\s*([A-Za-z_]\w*)\s*=[^=]/))) assigned[m[1].toLowerCase()] = 1;
    }
    for (i = 0; i < lines.length; i++) {
      var ln = lines[i].replace(/\/\/.*$/, ''), j, ch;
      if (!ln.trim()) continue;
      for (j = 0; j < ln.length; j++) {
        ch = ln[j];
        if (ch === '(') depth++;
        else if (ch === ')') { depth--; if (depth < 0) return { line: i + 1, msg: 'parêntese ")" sem abertura. Remova-o ou abra um "(" antes.' }; }
      }
      if (depth > 0) return { line: i + 1, msg: 'parêntese "(" sem fechamento. Feche com ")" antes do ";".' };
      var re = /(^|[^\w.])([A-Za-z_]\w*)/g, mm;
      while ((mm = re.exec(ln))) {
        var n = mm[2].toLowerCase();
        if (!isKnown(n) && !assigned[n]) return { line: i + 1, msg: 'variável desconhecida "' + mm[2] + '". Confira o nome ou atribua um valor antes.' };
      }
      if (!/;\s*$/.test(ln)) return { line: i + 1, msg: 'falta ";" no fim da equação.' };
    }
    return null;
  }

  // ---- blocos ----
  var host = $('#blocks'), state = {};
  BLOCKS.forEach(function (b) {
    var sec = document.createElement('section'); sec.className = 'sec'; sec.style.marginBottom = '18px';
    sec.innerHTML = '<div class="sec-h"><h2>' + b.title + '</h2><span class="num">' + b.hint + '</span></div>' +
      '<div class="ed"><div class="gut" aria-hidden="true"></div><textarea class="ta" spellcheck="false" autocomplete="off" aria-label="' + b.title + '"></textarea></div>' +
      '<p class="err-msg" hidden role="alert"><i data-lucide="circle-alert" class="ico"></i><span></span></p>';
    host.appendChild(sec);
    var s = { b: b, ed: sec.querySelector('.ed'), gut: sec.querySelector('.gut'), ta: sec.querySelector('textarea'), err: sec.querySelector('.err-msg'), timer: 0, error: null };
    s.ta.value = b.text; state[b.id] = s;
    renderGut(s);
    s.ta.addEventListener('input', function () { renderGut(s); updateDirty(); clearTimeout(s.timer); s.timer = setTimeout(function () { check(s); }, 400); });
    s.ta.addEventListener('scroll', function () { s.gut.scrollTop = s.ta.scrollTop; });
  });
  host.lastChild.style.marginBottom = '0';

  function renderGut(s) {
    var n = Math.max(s.b.rows, s.ta.value.split('\n').length), h = '', i;
    for (i = 1; i <= n; i++) h += '<div' + (s.error && s.error.line === i ? ' class="err"' : '') + '>' + i + '</div>';
    s.gut.innerHTML = h;
    s.ta.style.height = (n * 20 + 22) + 'px';
  }
  function check(s) {
    s.error = validate(s.ta.value);
    s.ed.classList.toggle('bad', !!s.error);
    s.err.hidden = !s.error;
    if (s.error) s.err.querySelector('span').innerHTML = '<span class="num">Linha ' + s.error.line + ':</span> ' + s.error.msg;
    renderGut(s);
    if (!s.error && !anyError()) applyVisual();
  }
  function anyError() { return BLOCKS.some(function (b) { return state[b.id].error; }); }

  function codeKey() { return BLOCKS.map(function (b) { return state[b.id].ta.value; }).join('\u0001'); }
  var ORIG = codeKey(), saved = ORIG;
  function dirty() { return codeKey() !== saved || $('#pname').value !== savedName; }
  var savedName = 'Meu preset';
  function updateDirty() { $('#tag').classList.toggle('dirty', dirty()); }
  $('#pname').addEventListener('input', updateDirty);

  function applyVisual() {
    var k = codeKey(), h = 0, i;
    for (i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) | 0;
    var p = { hue: (P.hue + Math.abs(h) % 120) % 360, style: Math.abs(h >> 5) % 4 };
    viz.setPreset(p, 600);
    var a = $('#applying'); a.classList.remove('run'); void a.offsetWidth; a.classList.add('run');
  }

  // ---- shaders ----
  (function () {
    var t = $('#sh-ta'); t.value = SHADER; t.style.height = (SHADER.split('\n').length * 20 + 22) + 'px';
    var g = '', n = SHADER.split('\n').length, i; for (i = 1; i <= n; i++) g += '<div>' + i + '</div>'; $('#sh-g').innerHTML = g;
    $('#sh-t').addEventListener('click', function () {
      var open = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!open)); $('#sh-b').hidden = open;
    });
  })();

  // ---- origem ----
  $('#from').innerHTML = 'a partir de: <b></b> · por <b></b>';
  $('#from').querySelectorAll('b')[0].textContent = P.title;
  $('#from').querySelectorAll('b')[1].textContent = P.author;

  // ---- toast ----
  var tt = 0;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 3200); }

  // ---- salvar ----
  var author = '';
  function doSave() {
    saved = codeKey(); savedName = $('#pname').value.trim() || 'Meu preset'; $('#pname').value = savedName; updateDirty();
    toast('Salvo como ' + savedName + ' · por ' + author + '.');
  }
  function trySave() {
    if (anyError()) { toast('Corrija os erros do motor antes de salvar.'); return; }
    if (!author) { openBalloon(); return; }
    doSave();
  }
  function openBalloon() { $('#balloon').hidden = false; $('#author').focus(); }
  function closeBalloon() { $('#balloon').hidden = true; }
  $('#save').addEventListener('click', function () { if (!$('#balloon').hidden) closeBalloon(); else trySave(); });
  $('#balloon').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('#author').value.trim();
    if (!v) { $('#author').focus(); return; }
    author = v; closeBalloon(); doSave();
  });

  // ---- fechar / descartar ----
  function setClosed(v) { $('#app').classList.toggle('closed', v); if (v) $('#reopen').focus(); else $('#pname').focus(); }
  function requestClose() {
    if (dirty()) { $('#confirm').hidden = false; $('#c-keep').focus(); } else setClosed(true);
  }
  function revert() {
    BLOCKS.forEach(function (b, i) { var s = state[b.id]; s.ta.value = b.text; s.error = null; s.err.hidden = true; s.ed.classList.remove('bad'); renderGut(s); });
    $('#pname').value = savedName; saved = ORIG; updateDirty();
    viz.setPreset(P, 600);
  }
  $('#close').addEventListener('click', requestClose);
  $('#discard').addEventListener('click', requestClose);
  $('#c-discard').addEventListener('click', function () { $('#confirm').hidden = true; revert(); setClosed(true); });
  $('#c-keep').addEventListener('click', function () { $('#confirm').hidden = true; });
  $('#reopen').addEventListener('click', function () { setClosed(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    e.preventDefault();
    if (!$('#balloon').hidden) { closeBalloon(); $('#save').focus(); return; }
    if (!$('#confirm').hidden) { $('#confirm').hidden = true; return; }
    if ($('#app').classList.contains('closed')) return;
    requestClose();
  });

  // ---- áudio agora ----
  var fmt = function (v) { return v.toFixed(2).replace('.', ','); };
  var boost = 0; viz.onBeat(function () { boost = 1; });
  function tick(now) {
    var l = viz.level(), t = now / 1000; boost *= 0.9;
    var v = [0.15 + l * 1.5 + boost * 0.5, 0.2 + l * 1.1 + 0.08 * Math.sin(t * 3.1), 0.1 + l * 0.8 + 0.12 * Math.sin(t * 7.3) + boost * 0.15];
    for (var i = 0; i < 3; i++) { $('#lb' + i).style.width = Math.min(100, v[i] / 2 * 100) + '%'; $('#lv' + i).textContent = fmt(v[i]); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- barra do protótipo (criada aqui para ficar fora do produto) ----
  var pr = document.createElement('div'); pr.className = 'proto';
  pr.innerHTML = '<b>Protótipo</b><button id="resetname">Resetar nome do autor</button>';
  document.body.appendChild(pr);
  $('#resetname').addEventListener('click', function () { author = ''; $('#author').value = ''; toast('Nome do autor apagado. O próximo salvamento pergunta de novo.'); });

  lucide.createIcons();
})();
</script>
</body>
</html>
