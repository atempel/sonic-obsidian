<!doctype html>
<!--
  Spike 040 — curva por frequência (#112). Mede, no Butterchurn de verdade:
  1. em que zona (bass/mid/treb) cai cada tom puro (onde o motor corta as zonas);
  2. o custo de um AnalyserNode próprio (FFT 2048/4096/8192) por quadro.
  Rodar: servir a raiz do repo (`python3 -m http.server 8765`) e `node spike/040/medir.cjs`.
-->
<meta charset="utf-8" />
<canvas id="c" width="320" height="180"></canvas>
<script type="module">
  import butterchurn from '../../node_modules/butterchurn/dist/butterchurn.min.js'
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  window.zones = async (sr) => {
    const ctx = new AudioContext({ sampleRate: sr })
    await ctx.resume()
    const viz = butterchurn.createVisualizer(ctx, document.getElementById('c'), { width: 320, height: 180, onlyUseWASM: true })
    const al = viz.renderer.audioLevels
    const audio = viz.renderer.audio
    const g = ctx.createGain()
    g.gain.value = 0.5
    viz.connectAudio(g)
    const out = { sr: ctx.sampleRate, starts: Array.from(al.starts), stops: Array.from(al.stops), rows: [] }
    for (const f of [25, 40, 60, 80, 100, 130, 160, 200, 300, 500, 800, 1200, 1500, 2000, 2800, 4000, 5000, 6000, 8000, 11000]) {
      const o = ctx.createOscillator()
      o.frequency.value = f
      o.connect(g)
      o.start()
      await wait(120)
      audio.sampleAudio()
      let peakBin = 0
      for (let i = 1; i < audio.freqArray.length; i++) if (audio.freqArray[i] > audio.freqArray[peakBin]) peakBin = i
      al.updateAudioLevels(60, 100)
      const s = al.imm[0] + al.imm[1] + al.imm[2]
      out.rows.push({ f, peakBin, share: Array.from(al.imm).map((v) => +(v / s).toFixed(2)) })
      o.stop()
      o.disconnect()
    }
    await ctx.close()
    return out
  }
  window.cost = async () => {
    const ctx = new AudioContext({ sampleRate: 48000 })
    await ctx.resume()
    const o = ctx.createOscillator()
    const g = ctx.createGain()
    o.connect(g)
    o.start()
    const res = {}
    for (const n of [2048, 4096, 8192]) {
      const an = ctx.createAnalyser()
      an.fftSize = n
      an.smoothingTimeConstant = 0
      g.connect(an)
      await wait(250)
      const buf = new Float32Array(an.frequencyBinCount)
      const w = new Float32Array(buf.length).fill(1.1)
      const N = 3000
      const t0 = performance.now()
      for (let k = 0; k < N; k++) {
        an.getFloatFrequencyData(buf)
        let s = 0
        let sw = 0
        for (let i = 1; i < buf.length; i++) {
          const m = 10 ** (buf[i] / 20)
          s += m
          sw += m * w[i]
        }
        res.last = sw / s
      }
      res[n] = +((performance.now() - t0) / N).toFixed(4)
    }
    await ctx.close()
    return res
  }
  window.ready = true
</script>
